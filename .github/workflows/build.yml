name: Build StatusShift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip $dest

      - name: Build
        run: dotnet build StatusShift.slnx --configuration Release -p:RestoreLockedMode=false

      - name: Stage package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter StatusShift.dll |
            Where-Object { $_.FullName -match "\\bin\\" } |
            Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Recurse StatusShift | Select-Object FullName
            throw "StatusShift.dll missing"
          }
          $out = "artifacts/StatusShift"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$($dll.DirectoryName)\*" $out -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out\images" | Out-Null
          $icon = $null
          foreach ($candidate in @(
            "images\icon.png",
            "$($dll.DirectoryName)\images\icon.png",
            "$($dll.DirectoryName)\icon.png"
          )) {
            if (Test-Path $candidate) { $icon = $candidate; break }
          }
          if (-not $icon) { throw "icon.png not found to package" }
          Copy-Item $icon "$out\images\icon.png" -Force
          Copy-Item $icon "$out\icon.png" -Force
          if (-not (Test-Path "$out\StatusShift.dll")) { throw "Copy failed" }
          if (-not (Test-Path "$out\images\icon.png")) { throw "images/icon.png missing from package" }
          Compress-Archive -Path "$out\*" -DestinationPath artifacts/StatusShift.zip -Force
          Write-Host "Packaged from $($dll.FullName) with icon $icon"

      - uses: actions/upload-artifact@v4
        with:
          name: StatusShift
          path: |
            artifacts/StatusShift/**
            artifacts/StatusShift.zip
          if-no-files-found: error

      - name: Attach zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/StatusShift.zip
